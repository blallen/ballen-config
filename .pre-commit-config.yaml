# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: local
    hooks:
      # Ruff runs from the locked environment rather than a pinned hook rev, so
      # uv.lock is the single source of the version. A pinned rev here would be
      # a second declaration that can drift from the dev dependency group, and
      # a formatter that disagrees with CI silently rewrites files.
      # --force-exclude makes Ruff honour extend-exclude even though pre-commit
      # passes explicit filenames.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --no-sync ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ballen-config-policy
        name: ballen-config policy
        entry: uv run --frozen --no-sync python -m ballen_config.policy
        language: system
        pass_filenames: false
      - id: bootstrap-zsh-syntax
        name: bootstrap zsh syntax
        entry: zsh -n
        language: system
        files: ^bootstrap$
