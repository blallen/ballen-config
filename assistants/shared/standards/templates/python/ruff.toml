line-length = 100
indent-width = 4
target-version = "py312"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[lint]
select = ["ALL"]
ignore = [
  "COM", # Formatter owns trailing commas.
  "CPY", # Repository files do not require copyright headers.
  "FIX", # Task comments may remain in source.
  "TC", # Keep imports explicit at runtime.
  "D401", # Google docstrings need not use imperative mood.
  "TD003", # Task comments do not require issue links.
  "ISC001", # Avoid conflicts with the formatter.
  "RET504", # Named intermediate results can aid readability.
]

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
allow-star-arg-any = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true

[lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "FBT001", "PLR2004", "S101", "SLF001"]
"**/__tests__/**/*.py" = ["ARG", "FBT001", "PLR2004", "S101", "SLF001"]
