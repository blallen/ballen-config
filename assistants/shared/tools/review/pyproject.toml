[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ballen-review-tools"
version = "0.1.0"
description = "Deterministic local review planning and publication tools"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.8.*"]

[project.scripts]
review-plan = "ballen_review_tools.plan_cli:main"
publish-github-review = "ballen_review_tools.github_cli:main"
publish-gitlab-review = "ballen_review_tools.gitlab_cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ballen_review_tools"]

[tool.mypy]
python_version = "3.12"
strict = true
