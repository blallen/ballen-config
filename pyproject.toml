[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ballen-config"
version = "0.1.0"
description = "Typed macOS bootstrap for Brandon Allen's development environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.8.*",
  "PyYAML>=6.0,<7.0",
  "tomlkit>=0.13,<1.0",
]

[project.scripts]
ballen-config = "ballen_config.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pre-commit==4.6.0",
  "pytest>=8.3",
  # uv.lock pins the exact Ruff the hooks and CI run; upgrade it deliberately
  # with `uv lock --upgrade-package ruff` and review the resulting diff.
  "ruff>=0.15",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ballen_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ballen_config"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 88
# Starter configurations are data for other repositories. Without this, Ruff
# treats the bundled ruff.toml as a nested project root and caches beside it.
#
# Markdown is excluded because Ruff 0.16 began formatting Python code blocks
# inside it. The plan and spec documents under docs/ are historical records of
# work already done; their embedded snippets are transcripts, not source this
# repository maintains. Excluding them keeps a Ruff upgrade from rewriting the
# record, and keeps a bare `ruff format` in agreement with the hook, which
# passes only Python files.
extend-exclude = ["assistants/shared/standards/templates", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
